name: secret-scan

# Shared org security action (claudeaiportfolio/ai-infra-templates/action):
# a deterministic, blocking gitleaks gate on every push/PR (working tree),
# plus the advisory Claude diff review on PRs. No per-repo gitleaks workflow —
# the standard is the shared action.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: claudeaiportfolio/ai-infra-templates/action@main
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
