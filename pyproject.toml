[project]
name = "credit-risk-monitoring"
version = "0.1.0"
description = "Branch-correctness evaluation surface for a credit-deterioration monitoring agent (EDGAR + Companies House multi-hop investigation)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0",
    # Arm B (C3b) drives Anthropic Managed Agents directly (client.beta.agents /
    # environments / sessions), so the SDK is a direct dependency here — the
    # `managed-agents-2026-04-01` beta surface requires a recent release.
    "anthropic>=0.115.0",
    # Shared portfolio packages — consumed (never re-implemented) as pinned
    # git-subdirectory references from ai-infra-templates.
    "agent-evals[judge] @ git+https://github.com/claudeaiportfolio/ai-infra-templates.git@agent-evals-v0.2.0#subdirectory=agent-evals",
    # The Arm A (C3a) investigation agent runs its multi-turn tool loop on the
    # shared agent runtime — consumed, never re-implemented. agent-core also
    # provides the `llm-provider` seam (used directly by the baseline) transitively;
    # agent-core-v0.2.1's embedded llm-provider IS the v0.2.1 temperature fix.
    # NOTE: a direct llm-provider pin is intentionally omitted — agent-core's dev
    # [tool.uv.sources] path override leaks into consumers and a direct tag pin
    # then resolves to a different commit SHA than agent-core's, which uv rejects
    # as "conflicting URLs". Restore the explicit pin once that leak is fixed
    # (tracked: ai-infra-templates follow-up issue).
    "agent-core @ git+https://github.com/claudeaiportfolio/ai-infra-templates.git@agent-core-v0.2.1#subdirectory=agent-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The shared packages are git-subdirectory (direct) references.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk_monitoring"]

[project.scripts]
credit-risk-eval = "credit_risk_monitoring.cli:main"

[project.optional-dependencies]
# Braintrust surfacing is opt-in: the adapter no-ops without BRAINTRUST_API_KEY,
# but the SDK is only pulled when this extra is installed.
braintrust = [
    "agent-evals[braintrust] @ git+https://github.com/claudeaiportfolio/ai-infra-templates.git@agent-evals-v0.2.0#subdirectory=agent-evals",
]
# The Arm A audit log persists to Postgres in production (connection from the
# environment; workload-identity -> Key Vault at deploy). The driver is an
# optional extra so credential-less CI/tests fall back to the in-memory sink
# without pulling a native dependency.
audit = [
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.13",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
ignore_missing_imports = true
