# Credit-risk monitoring eval fixtures.
#
# Design rationale, schema, and the downstream-question-framing decision are
# documented in fixtures/README.md — READ IT before editing these.
#
# Every hop was verified against PRIMARY sources (SEC EDGAR via efts.sec.gov /
# data.sec.gov / www.sec.gov/Archives; UK Companies House). Facts that could not
# be fetched are EXCLUDED from ground_truth and noted under verification_caveats —
# never assert an unconfirmed fact as ground truth.
#
# classification:
#   multi_hop            — chain must be traversed; agent should WIN, single-shot should FAIL
#   single_hop_control   — healthy issuer; correct behaviour is to resolve in ONE hop and STOP
#   trap_control         — looks like a credit event but is benign; correct behaviour is read the
#                          exhibit, conclude benign, and STOP (tests against over-investigation)

multi_hop:

  - id: valaris-uk-subsidiary-charge
    issuer: { name: "Valaris plc", cik: "0000314808", ch_number: "07023598" }
    classification: multi_hop
    jurisdiction: "US<->UK"
    depth: 4
    question: >
      Valaris plc's 2020 Chapter 11 restructuring support agreement named several
      UK-incorporated debtors. For its UK subsidiary Ensco Global Resources Limited,
      what registered charge (type and date) was created during the bankruptcy, and
      what is that company's current Companies House status?
    ground_truth_path:
      - step: 1
        source: "8-K (Items 1.01/1.03/2.04)"
        locator: "EDGAR acc 0001104659-20-096796 (2020-08-19)"
        finding: "Chapter 11 + entry into a Restructuring Support Agreement (Exhibit 10.1); affiliate debtors are not in the 8-K body."
        triggers: "must open Exhibit 10.1 to find the debtor entities"
      - step: 2
        source: "Exhibit 10.1 (RSA), Exhibit D debtor table"
        locator: ".../000110465920096796/tm2027797d1_ex10-1.htm"
        finding: "names UK-incorporated debtor Ensco Global Resources Ltd"
        triggers: "UK entity resolves at Companies House, not SEC"
      - step: 3
        source: "Companies House company record"
        locator: "CH 07098531 (Ensco Global Resources Limited)"
        finding: "status Dissolved 2024-07-21 (members' voluntary winding-up)"
        triggers: "filing history / charges"
      - step: 4
        source: "Companies House charges"
        locator: "CH 07098531 /charges"
        finding: "MR01 charge 070985310001 created 2020-09-25 (security taken mid-Chapter 11)"
        triggers: terminal
    expected_stop_depth: 4
    expected_answer: >
      An MR01 registered charge (id 070985310001) created 2020-09-25 over Ensco Global
      Resources Limited (CH 07098531); the company is now Dissolved (2024-07-21).
    verification_caveats: "Charge 'persons entitled' field is JS-rendered and was not fetched — excluded from ground truth."

  - id: hertz-uk-receivables-charge-holder
    issuer: { name: "Hertz Global Holdings / The Hertz Corporation", cik: "0001657853 / 0000047129" }
    classification: multi_hop
    jurisdiction: "US->UK"
    depth: 4
    # GENUINE-DISCOVERY FRAMING (2026-07): the question does NOT name the target UK
    # entity, and — unlike valaris/revlon — the SEC filing does not name it either.
    # Verified against the primary source: the Chapter 11 8-K (acc 0001104659-20-065674,
    # tm2020858d1_8k.htm) carves out "the direct and indirect subsidiary companies
    # located outside of the United States and Canada (the 'International Subsidiaries')"
    # and names only Hertz International Limited + Hertz Holdings Netherlands BV — NOT
    # the UK receivables-financing entity. So the specific entity is only discoverable
    # by SEARCHING Companies House. The investigable property "Hertz's UK receivables-
    # financing subsidiary" uniquely identifies Hertz UK Receivables Ltd (CH 08789381):
    # a CH search on "Hertz receivables" returns it as the sole "* RECEIVABLES *" hit
    # (distinct from Hertz Vehicle/Fleet FINANCING entities). The genuine chain is
    # therefore Chapter 11 8-K -> CH company-search (discover) -> CH profile (confirm)
    # -> CH charges (holder): edgar_filing -> companies_house x3, depth 4. Every
    # asserted fact is primary-source verified; the answer (Credit Agricole CIB) is
    # unchanged from the pre-naming version.
    question: >
      Hertz's May 2020 Chapter 11 petition excluded its subsidiaries located outside
      the United States and Canada without naming them individually. Hertz funded its
      UK operations through a UK receivables-financing subsidiary. Identify that
      subsidiary and determine which bank holds its outstanding registered charges.
    ground_truth_path:
      - step: 1
        source: "8-K (Item 1.03)"
        locator: "EDGAR acc 0001104659-20-065674 (2020-05-26), tm2020858d1_8k.htm"
        finding: "Chapter 11 (Case 20-11218, D. Del.); carves out 'the direct and indirect subsidiary companies located outside of the United States and Canada (the International Subsidiaries)' — names Hertz International Limited + Hertz Holdings Netherlands BV, but NOT the UK receivables entity"
        triggers: "the carve-out establishes a CLASS of non-US subs; the specific UK receivables entity must be DISCOVERED at the UK registry"
      - step: 2
        source: "Companies House company search"
        locator: "CH /search/companies q='Hertz receivables'"
        finding: "search surfaces 'HERTZ UK RECEIVABLES LTD' (no. 08789381) as the sole receivables entity among the Hertz UK companies"
        triggers: "identified the entity by property -> confirm its record"
      - step: 3
        source: "Companies House company record"
        locator: "CH 08789381 (Hertz UK Receivables Limited)"
        finding: "active UK ltd, registered number 08789381, with outstanding registered charges"
        triggers: "charges expose who holds the security"
      - step: 4
        source: "Companies House charges"
        locator: "CH 08789381 /charges"
        finding: "outstanding registered charges held by Credit Agricole Corporate and Investment Bank (Credit Agricole CIB) — created 2013-12-17 and 2014-11-04"
        triggers: terminal
    expected_stop_depth: 4
    expected_answer: >
      Hertz's UK receivables-financing subsidiary is Hertz UK Receivables Limited
      (CH 08789381); Credit Agricole CIB (Credit Agricole Corporate and Investment
      Bank) holds its outstanding registered charges. (Sibling opco Hertz (U.K.)
      Limited, CH 00597994, carries separate charges to Lombard North Central.)
    verification_caveats: >
      A discrete rating-agency hop was not pursued; chain stands without it. The entity
      is discovered by CH search (not pre-named and not named in the 8-K), so the chain
      is edgar_filing -> CH search -> CH profile -> CH charges (depth 4). The Credit
      Agricole CIB answer is primary-source verified at Companies House.

  - id: revlon-elizabeth-arden-uk-charge
    issuer: { name: "Revlon, Inc. / Revlon Consumer Products", cik: "0000887921 / 0000890547" }
    classification: multi_hop
    jurisdiction: "US->UK"
    depth: 4
    # GENUINE-DISCOVERY FRAMING (2026-07): the question does NOT name the target
    # subsidiary. It anchors on an investigable property — "the one filing debtor
    # incorporated in the United Kingdom" — that the analyst can only establish by
    # opening Exhibit 99.1 and reading the debtor list. Verified against the primary
    # source: Exhibit 99.1 lists ~48 filing subsidiaries, of which EXACTLY ONE is
    # UK-incorporated ("Elizabeth Arden (UK) Ltd."); the others are US (Inc./LLC),
    # plus a Canada entity and a Puerto Rico entity. So "the sole UK debtor" uniquely
    # identifies Elizabeth Arden (UK) Ltd without pre-naming it, and the full chain
    # (8-K -> Exhibit 99.1 -> CH -> charges) is REQUIRED to answer. Ground truth and
    # depth are unchanged from the pre-naming version; only the question changed.
    question: >
      Revlon's 2022 Chapter 11 filing listed its filing subsidiaries in an exhibit,
      exactly one of which is incorporated in the United Kingdom. Identify that UK
      debtor, and determine what registered charge was created over it around Revlon's
      2023 emergence from bankruptcy and which US party is its secured party
      (collateral agent).
    ground_truth_path:
      - step: 1
        source: "8-K (Item 1.03)"
        locator: "EDGAR acc 0001140361-22-023182 (2022-06-16)"
        finding: "Revlon + subsidiaries filed Chapter 11 (SDNY) 2022-06-15; filing subsidiaries 'listed in Exhibit 99.1' — the 8-K body does NOT name the UK debtor"
        triggers: "must open Exhibit 99.1 for the debtor list to discover the UK entity"
      - step: 2
        source: "Exhibit 99.1 (debtor list)"
        locator: "brhc10038750_ex99-1.htm (same accession)"
        finding: "of the ~48 filing subsidiaries, the ONLY UK-incorporated debtor is 'Elizabeth Arden (UK) Ltd.' (rest are US/Canada/Puerto Rico)"
        triggers: "the sole UK entity -> resolve at Companies House"
      - step: 3
        source: "Companies House"
        locator: "CH 04126357 (Elizabeth Arden (UK) Ltd)"
        finding: "active UK ltd; 17 charges (6 outstanding); officer changes"
        triggers: "charges expose post-emergence security"
      - step: 4
        source: "Companies House charge (MR01)"
        locator: "CH 04126357 charge 0412 6357 0014"
        finding: "charge created 2023-05-02; persons entitled: Jefferies Finance LLC (Collateral Agent)"
        triggers: terminal
    expected_stop_depth: 4
    expected_answer: >
      An MR01 charge (0412 6357 0014) created 2023-05-02 over Elizabeth Arden (UK) Ltd
      (CH 04126357); secured party / collateral agent is Jefferies Finance LLC.
    verification_caveats: "The 'exit-financing' characterization of the charge is INFERRED (date = emergence, named collateral agent) but the underlying credit-agreement exhibit was not opened; ground truth asserts only the charge + collateral agent, not its purpose."

  - id: bbby-default-to-sp-rating
    issuer: { name: "Bed Bath & Beyond Inc.", cik: "0000886158" }
    classification: multi_hop
    jurisdiction: "US-only"
    depth: 3
    question: >
      After Bed Bath & Beyond's early-2023 going-concern disclosure, it reported events
      of default under a specific credit facility. Which facility and admin agent were
      involved, and what credit rating did S&P assign as a result (and on what date)?
    ground_truth_path:
      - step: 1
        source: "8-K (Item 8.01 + Ex 99.1)"
        locator: "EDGAR acc 0001193125-23-002004 (2023-01-05)"
        finding: "'substantial doubt about ... ability to continue as a going concern'; names NO facility, agent, or actual default"
        triggers: "forces a forward lookup to the concrete default"
      - step: 2
        source: "8-K (Item 8.01 + Ex 99.3)"
        locator: "EDGAR acc 0001193125-23-025748 (2023-02-06)"
        finding: "events of default ~2023-01-13 under the $1.130B ABL Facility; JPMorgan Chase (admin agent) sent a 2023-01-25 acceleration notice"
        triggers: "dated, named-agent acceleration is what a rating agency reacts to"
      - step: 3
        source: "S&P Global Ratings action"
        locator: "S&P 'BBBY Downgraded To D From CC On Expected General Default' (2023-01-27)"
        finding: "issuer credit rating cut to D (default)"
        triggers: terminal
    expected_stop_depth: 3
    expected_answer: >
      Events of default under the $1.130B ABL Facility (admin agent JPMorgan Chase,
      acceleration notice 2023-01-25); S&P downgraded the issuer credit rating to 'D'
      (default) on 2023-01-27. (Deployable as a clean 2-hop default->rating.)
    verification_caveats: "S&P press-release body is paywalled (403); rating value + date corroborated by S&P's own headline and two aggregators, full text UNCONFIRMED."

  - id: greenrose-foreclosure-recipient-and-liquidation
    issuer: { name: "The Greenrose Holding Company Inc.", cik: "0001790665" }
    classification: multi_hop
    jurisdiction: "US-only"
    depth: 4
    obscure: true
    question: >
      Greenrose Holding's 2022-23 distress led to a strict foreclosure on its cannabis
      subsidiaries (Theraplant and True Harvest). Which entity received that collateral,
      and in which court and case number did Greenrose ultimately file for liquidation?
    ground_truth_path:
      - step: 1
        source: "8-K (Items 1.01/2.03/2.04)"
        locator: "EDGAR acc 0001213900-22-063842 (2022-10-13)"
        finding: "Forbearance over Specified Defaults under the Nov-2021 Credit Agreement; names guarantor subs Theraplant LLC and True Harvest Holdings Inc.; agent DXR Finance LLC"
        triggers: "names subsidiaries/agent; points to exhibit-level lender stack"
      - step: 2
        source: "Exhibit EX-10.1 (Strict Foreclosure Agreement)"
        locator: "EDGAR acc 0001213900-23-023263 (8-K 2023-03-27), ea175766ex10-1_greenrose.htm"
        finding: "full lender stack — DXR Finance LLC (agent), DXR-GL Holdings I/II/III, DXR Finance Parent, DXR Finance HoldCo"
        triggers: "DXR HoldCo + Theraplant names drive downstream lookups"
      - step: 3
        source: "8-K (Item 2.01)"
        locator: "EDGAR acc 0001213900-23-058964 (2023-07-24)"
        finding: "2023-07-21 strict foreclosure CLOSED: Theraplant & True Harvest collateral transferred to DXR Finance HoldCo ('NewCo')"
        triggers: "wind-down -> liquidation filing"
      - step: 4
        source: "8-K (Item 1.03)"
        locator: "EDGAR acc 0001213900-24-054658 (2024-06-21)"
        finding: "Chapter 7 filed 2024-06-18, EDNY Case 8-24-72384; trustee to liquidate"
        triggers: terminal
    expected_stop_depth: 4
    expected_answer: >
      The Theraplant and True Harvest collateral was transferred to DXR Finance HoldCo
      ('NewCo') via the 2023-07-21 strict foreclosure; Greenrose later filed Chapter 7 on
      2024-06-18 in the EDNY (Case 8-24-72384).
    verification_caveats: >
      Hops 1-4 fetched & confirmed from EDGAR. A related Connecticut Appellate Court
      foreclosure (DXR Fin. Parent v. Theraplant, 223 Conn. App. 362) exists per the
      caption but the opinion text was not fetched -> excluded from ground truth.
      DXR entities have NO SEC filings of their own, which is why this chain is genuinely
      memory-proof (an obscure sub-penny OTC issuer).

  - id: wejo-uk-administration
    issuer: { name: "Wejo Group Limited", cik: "0001864448" }
    classification: multi_hop
    jurisdiction: "US->UK"
    depth: 3
    obscure: partial   # ex-"unicorn" -> headline partially memorable; question anchored on UK registry facts
    question: >
      Wejo Group Limited (a Bermuda-incorporated SEC registrant) entered distress in
      2023 through a UK operating subsidiary. Which UK company entered administration,
      what is its Companies House number, and who were the appointed joint administrators?
    ground_truth_path:
      - step: 1
        source: "8-K (Item 1.03)"
        locator: "EDGAR acc 0001864448-23-000131 (2023-05-30)"
        finding: "Wejo Limited, an indirect wholly-owned UK subsidiary, filed a Notice of Intention to appoint an administrator (High Court, Manchester; Sch. B1 Insolvency Act 1986)"
        triggers: "names an England-and-Wales opco distinct from the Bermuda registrant -> UK"
      - step: 2
        source: "8-K (Item 1.03)"
        locator: "EDGAR acc 0001864448-23-000151 (2023-09-18); appointment first in acc 0001864448-23-000143 (2023-07-18)"
        finding: "Wejo Limited appointed Andrew Poxon & Hilary Pascoe of Leonard Curtis as joint administrators"
        triggers: "named UK entity + IPs -> verify at Companies House"
      - step: 3
        source: "Companies House"
        locator: "CH 08813730 (Wejo Limited)"
        finding: "status 'In Administration'; filing history shows appointment, administrators' proposal, progress reports"
        triggers: terminal
    expected_stop_depth: 3
    expected_answer: >
      Wejo Limited (CH 08813730) entered administration in 2023; joint administrators
      Andrew Poxon and Hilary Pascoe of Leonard Curtis.
    verification_caveats: >
      Hops 1-3 fetched & confirmed (8-K bodies + Companies House 'In Administration').
      Creditor detail (~GBP 104.5M claims incl. GLAS/General Motors) is press-reported,
      not registry-fetched -> excluded from ground truth. Headline is partially memorable,
      so the question is deliberately anchored on the registry facts, not "what happened to Wejo?".

single_hop_controls:

  - id: control-microsoft
    issuer: { name: "Microsoft Corporation", cik: "0000789019" }
    classification: single_hop_control
    jurisdiction: "US-only"
    depth: 1
    question: >
      Based on its recent SEC filings, has Microsoft disclosed any covenant waiver,
      default, forbearance, or going-concern indicator that warrants escalation?
    ground_truth_path:
      - step: 1
        source: "EDGAR submissions index"
        locator: "data.sec.gov submissions CIK 0000789019; latest 10-K acc 0000950170-25-100235 (2025-07-30)"
        finding: "recent 8-Ks routine (Item 5.02 officer changes, 2.02 earnings); no distress"
        triggers: terminal
    expected_stop_depth: 1
    expected_answer: "No. No credit-distress events in recent filings; routine disclosures only. No further investigation warranted."

