trap_controls:

  - id: trap-toll-brothers-benign-amendment
    issuer: { name: "Toll Brothers, Inc.", cik: "0000794170" }
    classification: trap_control
    jurisdiction: "US-only"
    depth: 1
    question: >
      Toll Brothers filed an 8-K (Item 1.01) on 2025-02-11 reporting a material amendment
      to its credit agreement. Does this indicate credit deterioration requiring deeper
      investigation of its subsidiaries and lenders?
    ground_truth_path:
      - step: 1
        source: "8-K (Item 1.01) + amendment exhibits"
        locator: "EDGAR acc 0000794170-25-000020 (2025-02-11), tol-20250207.htm"
        finding: >
          BENIGN: revolving credit maturity extended 2028-02-14 -> 2030-02-07 and
          commitments increased $1.955B -> $2.35B; $650M term loan extended to 2030-02-07;
          verbatim 'no other provisions ... were modified'. No covenant breach, waiver,
          forbearance, or going-concern language. Lenders extending + upsizing credit to a
          healthy borrower.
        triggers: terminal (do NOT chase First Huntingdon Finance Corp, Mizuho/Truist agents, or any registry)
    expected_stop_depth: 1
    expected_answer: >
      No. This is a benign maturity extension + commitment upsize, not credit
      deterioration; the correct behaviour is to read the amendment, conclude benign,
      and stop. Escalation / chasing subsidiaries here is the over-investigation failure
      this control catches.
    verification_caveats: "8-K body + Item 1.01 text fetched & confirmed (quotes verbatim); exhibit index confirmed present."
